
name: Build and Release Shopping Notepad APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopping-notepad-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          else
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            ls -la "$SDK"
            exit 1
          fi

          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --list_installed

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK="$(find . -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK not found. Build output:"
            find . -type f -path '*/build/outputs/apk/*/*.apk'
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ShoppingNotepad.apk

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

          if [ -z "$TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Shopping Notepad ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/ShoppingNotepad.apk
