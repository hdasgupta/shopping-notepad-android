
name: Build and Release Shopping Notepad APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Pin the command-line tools version instead of using "latest".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          java -version
          sdkmanager --version
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find . -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "No release APK found."
            find . -type f -path '*/build/outputs/apk/*/*.apk'
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/ShoppingNotepad.apk
          echo "path=release/ShoppingNotepad.apk" >> "$GITHUB_OUTPUT"

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shopping Notepad ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/ShoppingNotepad.apk
