
name: Build and Release Shopping Notepad APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopping-notepad-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_SIGNING_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Locate release APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' 2>/dev/null | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK not found."
            find . -type f -path '*/build/outputs/apk/*/*.apk' || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ShoppingNotepad-unsigned.apk
          echo "Found APK: $APK"

      - name: Decode signing keystore
        if: env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Sign APK
        if: env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out release/ShoppingNotepad.apk \
            release/ShoppingNotepad-unsigned.apk

          "$APKSIGNER" verify --verbose release/ShoppingNotepad.apk

      - name: Select APK for release
        id: asset
        shell: bash
        run: |
          if [ -f release/ShoppingNotepad.apk ]; then
            echo "path=release/ShoppingNotepad.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=release/ShoppingNotepad-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing. Publishing an unsigned APK."
          fi

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

          if [ -z "$TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION="${TAG#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version tag: $TAG"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Shopping Notepad ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.asset.outputs.path }}
